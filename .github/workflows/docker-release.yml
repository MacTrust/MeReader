name: Build and Release Docker Container

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-release:
    if: github.repository == 'wu21-web/MeReader'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Print additional debug info
        run: |
          echo '=============================Docker Info============================='
          docker info
          echo '=============================Docker Context============================='
          docker context show

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image (Release)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mereader:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/mereader:latest

      - name: Build and push Docker image (Manual)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mereader:latest
